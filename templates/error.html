{% extends "base.html" %}

{% block title %}Error {{ error_code }} — DocuMind{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="mb-4">
                    <span class="badge bg-danger-subtle text-danger display-4 p-3 rounded-circle">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </span>
                </div>
                <h2 class="fw-bold mb-2 text-dark">{{ title or "Application Notice" }}</h2>
                <p class="lead text-muted fs-6 mb-4">{{ message or "An error occurred while processing your request." }}</p>
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="fa-solid fa-house me-2"></i> Return to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
